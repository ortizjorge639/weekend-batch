<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>The Batch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--card:#141414;--accent:#39ff14;--dim:#555;
  --text:#e8e8e8;--sub:#999;--chip:#1a1a1a;--tag:#222;
  --border:#2a2a2a;--drawer:#111;--danger:#ff4444;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}

/* ── Feed ── */
#feed{
  height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;
}
#feed::-webkit-scrollbar{display:none}

.card{
  min-height:100dvh;scroll-snap-align:start;
  display:flex;flex-direction:column;justify-content:center;
  padding:24px 20px 72px;border-bottom:1px solid var(--border);
  position:relative;
}
.card.dismissed{opacity:.4}
.card.dismissed::after{
  content:'dismissed';position:absolute;top:20px;right:20px;
  font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
}

.intro-card,.outro-card{
  min-height:100dvh;scroll-snap-align:start;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:40px 24px 72px;text-align:center;
}
.intro-card h1{font-size:2rem;font-weight:800;color:var(--accent);margin-bottom:8px}
.intro-card p{color:var(--sub);font-size:.95rem;margin-top:6px}
.outro-card p{color:var(--sub);font-size:1.1rem}

/* ── Chips ── */
.source-chip{
  display:inline-block;background:var(--chip);border:1px solid var(--border);
  border-radius:20px;font-size:11px;padding:3px 10px;color:var(--sub);
  margin-bottom:10px;text-transform:uppercase;letter-spacing:.07em;
}
.author{font-size:.78rem;color:var(--dim);margin-bottom:10px}
.title{font-size:1.15rem;font-weight:700;line-height:1.3;margin-bottom:10px}
.quote{
  font-size:.88rem;color:var(--sub);line-height:1.5;
  border-left:2px solid var(--accent);padding-left:10px;margin-bottom:12px;
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{
  background:var(--tag);border-radius:12px;padding:3px 9px;
  font-size:.75rem;color:var(--dim);
}

/* ── Buttons ── */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.btn{
  padding:8px 18px;border-radius:20px;border:1px solid var(--border);
  background:var(--chip);color:var(--text);font-size:.85rem;cursor:pointer;
  transition:background .15s;
}
.btn:hover{background:var(--border)}
.btn-spar{border-color:#7c3aed;color:#a78bfa}
.btn-act{border-color:#059669;color:#34d399}
.btn-open{border-color:var(--dim);color:var(--sub);font-size:.8rem}
.btn-dismiss{border-color:var(--danger);color:var(--danger);font-size:.75rem}

/* ── Drawer ── */
.drawer{
  display:none;background:var(--drawer);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-top:10px;
}
.drawer.open{display:block}
.drawer h3{font-size:.8rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.prompt-row{
  padding:8px 10px;border-radius:8px;border:1px solid var(--border);
  margin-bottom:6px;cursor:pointer;transition:background .12s;
}
.prompt-row:hover{background:var(--border)}
.prompt-title{font-size:.88rem;color:var(--text)}
.prompt-sub{font-size:.75rem;color:var(--dim);margin-top:2px}

/* ── Toast ── */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1e1e1e;border:1px solid var(--border);border-radius:24px;
  padding:8px 18px;font-size:.82rem;color:var(--text);opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:100;
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Top bar ── */
#topbar{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:rgba(13,13,13,.9);backdrop-filter:blur(6px);
  z-index:50;border-bottom:1px solid var(--border);
}
#topbar h2{font-size:.9rem;font-weight:700;color:var(--accent)}
#week-select{
  background:var(--chip);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:.78rem;padding:4px 8px;
}
#counter{font-size:.78rem;color:var(--dim)}

/* ── Progress ticks ── */
#progress{
  position:fixed;right:8px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:4px;z-index:50;
}
.tick{width:4px;height:4px;border-radius:2px;background:var(--dim);transition:background .2s}
.tick.active{background:var(--accent)}

/* ── Bottom bar ── */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;
  height:52px;background:rgba(13,13,13,.95);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  border-top:1px solid var(--border);z-index:50;gap:16px;
}
#bottombar button{
  background:none;border:none;color:var(--sub);font-size:.75rem;
  cursor:pointer;padding:6px 10px;
}
#bottombar button:hover{color:var(--text)}

/* ── Updates banner ── */
#updates-banner{
  display:none;position:fixed;top:52px;left:0;right:0;
  background:#1a0a00;border-bottom:1px solid #553300;
  padding:8px 16px;font-size:.78rem;color:#f97316;z-index:49;
  display:flex;align-items:center;justify-content:space-between;
}
#updates-banner.hidden{display:none!important}
</style>
</head>
<body>

<div id="topbar">
  <h2>The Batch</h2>
  <select id="week-select"></select>
  <span id="counter">—</span>
</div>

<div id="updates-banner" class="hidden">
  <span id="updates-msg"></span>
  <button id="copy-updates-btn" class="btn" style="font-size:.75rem;padding:4px 10px">Copy updates.json</button>
</div>

<div id="feed"></div>

<div id="progress"></div>

<div id="bottombar">
  <button id="btn-prev">← prev</button>
  <button id="btn-next">next →</button>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const UPDATES_KEY = 'batch_updates_queue';
let WEEKS = [];
let ITEMS = [];
let currentCard = 0;
let totalCards = 0;
let openDrawer = null;

// ── updates.json local queue ───────────────────────────────────────────────
function loadQueue() {
  try { return JSON.parse(localStorage.getItem(UPDATES_KEY) || '[]'); }
  catch { return []; }
}
function saveQueue(q) {
  localStorage.setItem(UPDATES_KEY, JSON.stringify(q));
}
function enqueue(entry) {
  const q = loadQueue();
  q.push(entry);
  saveQueue(q);
}
function showUpdatesBanner() {
  const q = loadQueue();
  const banner = document.getElementById('updates-banner');
  if (q.length === 0) { banner.classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  document.getElementById('updates-msg').textContent =
    `${q.length} pending mark(s) in local queue — paste into updates.json then clear.`;
}
document.getElementById('copy-updates-btn').addEventListener('click', () => {
  const q = loadQueue();
  navigator.clipboard.writeText(JSON.stringify(q, null, 2)).then(() => {
    toast('Copied! Paste into updates.json on your repo.');
  });
});

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── Context block for clipboard ────────────────────────────────────────────
function contextBlock(item, mode, promptText) {
  return [
    `itemId: ${item.itemId}`,
    `title: ${item.title}`,
    `quote: ${item.quote}`,
    `url: ${item.url}`,
    `---`,
    `mode: ${mode}`,
    `prompt: ${promptText}`,
  ].join('\n');
}

// ── Card builder ───────────────────────────────────────────────────────────
function buildCard(item, idx) {
  const el = document.createElement('div');
  el.className = 'card' + (item.state === 'dismissed' ? ' dismissed' : '');
  el.dataset.idx = idx;

  // Mark seen on scroll-into-view
  if (item.state === 'new') {
    const obs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        item.state = 'seen';
        enqueue({ itemId: item.itemId, state: 'seen', ts: new Date().toISOString() });
        obs.disconnect();
      }
    }, { threshold: 0.6 });
    obs.observe(el);
  }

  el.innerHTML = `
    <span class="source-chip">${esc(item.source)}</span>
    <div class="author">${esc(item.author)} <span style="color:var(--dim)">${esc(item.handle)}</span> · ${esc(item.when)}</div>
    <div class="title">${esc(item.title)}</div>
    ${item.quote ? `<div class="quote">${esc(item.quote)}</div>` : ''}
    <div class="tags">${(item.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="actions">
      <button class="btn btn-spar" data-mode="spar">Spar</button>
      <button class="btn btn-act" data-mode="act">Act</button>
      <a class="btn btn-open" href="${esc(item.url)}" target="_blank" rel="noopener">Open ↗</a>
      <button class="btn btn-dismiss">Dismiss</button>
    </div>
    <div class="drawer" id="drawer-${idx}">
      <h3 class="drawer-label">—</h3>
      <div class="prompts"></div>
    </div>
  `;

  // Spar / Act buttons
  el.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      const drawerId = `drawer-${idx}`;
      const drawer = document.getElementById(drawerId);
      const isOpen = drawer.classList.contains('open') && openDrawer === drawerId && drawer.dataset.mode === mode;
      // Close any open drawer
      document.querySelectorAll('.drawer.open').forEach(d => d.classList.remove('open'));
      if (isOpen) { openDrawer = null; return; }

      const prompts = item[mode] || [];
      drawer.querySelector('.drawer-label').textContent = mode === 'spar' ? '⚡ Spar prompts' : '✅ Act prompts';
      const container = drawer.querySelector('.prompts');
      container.innerHTML = '';
      prompts.forEach(([title, sub]) => {
        const row = document.createElement('div');
        row.className = 'prompt-row';
        row.innerHTML = `<div class="prompt-title">${esc(title)}</div><div class="prompt-sub">${esc(sub)}</div>`;
        row.addEventListener('click', () => {
          const block = contextBlock(item, mode, title);
          navigator.clipboard.writeText(block).catch(() => {});
          const newState = mode === 'spar' ? 'sparred' : 'acted';
          item.state = newState;
          enqueue({ itemId: item.itemId, state: newState, thread: { ts: new Date().toISOString(), mode, note: title } });
          showUpdatesBanner();
          toast(`Copied context block · marked ${newState}`);
        });
        container.appendChild(row);
      });

      drawer.dataset.mode = mode;
      drawer.classList.add('open');
      openDrawer = drawerId;

      // Queue mark: seen→sparred/acted
      const newState = mode === 'spar' ? 'sparred' : 'acted';
      if (item.state !== newState) {
        item.state = newState;
        enqueue({ itemId: item.itemId, state: newState, ts: new Date().toISOString() });
        showUpdatesBanner();
      }
    });
  });

  // Dismiss
  el.querySelector('.btn-dismiss').addEventListener('click', () => {
    item.state = 'dismissed';
    el.classList.add('dismissed');
    enqueue({ itemId: item.itemId, state: 'dismissed', ts: new Date().toISOString() });
    showUpdatesBanner();
    toast('Dismissed');
  });

  return el;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Freshness line ─────────────────────────────────────────────────────────
function freshnessLine(syncedAt) {
  if (!syncedAt) return 'not synced';
  const fmt = ts => ts ? new Date(ts).toLocaleString() : 'not synced';
  return `bookmarks: ${fmt(syncedAt.bookmarks)} · emails: ${fmt(syncedAt.emails)}`;
}

// ── Render a week ──────────────────────────────────────────────────────────
function renderWeek(weekData) {
  ITEMS = [...(weekData.bookmarks || []), ...(weekData.emails || [])];
  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  // Intro card
  const intro = document.createElement('div');
  intro.className = 'intro-card';
  intro.innerHTML = `
    <h1>The Batch</h1>
    <p>Week of <strong>${esc(weekData.week)}</strong></p>
    <p>${ITEMS.length} items · ${(weekData.bookmarks||[]).length} bookmarks · ${(weekData.emails||[]).length} emails</p>
    <p style="margin-top:14px;font-size:.78rem;color:var(--dim)">${esc(freshnessLine(weekData.syncedAt))}</p>
  `;
  feed.appendChild(intro);

  // Item cards
  ITEMS.forEach((item, i) => feed.appendChild(buildCard(item, i)));

  // Outro card
  const outro = document.createElement('div');
  outro.className = 'outro-card';
  outro.innerHTML = `<p style="color:var(--accent);font-size:1.5rem;margin-bottom:10px">✓</p><p>You've seen everything.</p><p style="color:var(--dim);font-size:.85rem;margin-top:8px">Next batch drops Saturday 13:00 UTC.</p>`;
  feed.appendChild(outro);

  totalCards = ITEMS.length + 2; // intro + items + outro
  buildTicks();
  updateCounter(0);
}

// ── Progress ticks ─────────────────────────────────────────────────────────
function buildTicks() {
  const pg = document.getElementById('progress');
  pg.innerHTML = '';
  for (let i = 0; i < totalCards; i++) {
    const t = document.createElement('div');
    t.className = 'tick' + (i === 0 ? ' active' : '');
    pg.appendChild(t);
  }
}

function updateCounter(n) {
  currentCard = n;
  document.getElementById('counter').textContent = `${n + 1} / ${totalCards}`;
  document.querySelectorAll('.tick').forEach((t, i) => t.classList.toggle('active', i === n));
}

// ── Scroll tracking ────────────────────────────────────────────────────────
function initScrollTracking() {
  const feed = document.getElementById('feed');
  let ticking = false;
  feed.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const h = feed.clientHeight;
      const idx = Math.round(feed.scrollTop / h);
      updateCounter(idx);
      ticking = false;
    });
  });
}

function scrollToCard(n) {
  const feed = document.getElementById('feed');
  const h = feed.clientHeight;
  feed.scrollTo({ top: n * h, behavior: 'smooth' });
}

// ── Keyboard nav ───────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') scrollToCard(Math.min(currentCard + 1, totalCards - 1));
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') scrollToCard(Math.max(currentCard - 1, 0));
});

document.getElementById('btn-prev').addEventListener('click', () => scrollToCard(Math.max(currentCard - 1, 0)));
document.getElementById('btn-next').addEventListener('click', () => scrollToCard(Math.min(currentCard + 1, totalCards - 1)));

// ── Week switcher ──────────────────────────────────────────────────────────
async function loadWeek(week) {
  const res = await fetch(`batches/${week}.json`);
  const data = await res.json();
  renderWeek(data);
  scrollToCard(0);
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  const res = await fetch('batches/index.json');
  WEEKS = await res.json(); // newest first after cron runs; seed has only one

  const sel = document.getElementById('week-select');
  WEEKS.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = w;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => loadWeek(sel.value));

  initScrollTracking();
  showUpdatesBanner();
  await loadWeek(WEEKS[0]);
}

boot().catch(err => {
  document.getElementById('feed').innerHTML = `<div class="intro-card"><p style="color:var(--danger)">Failed to load: ${err.message}</p></div>`;
});
</script>
</body>
</html>
